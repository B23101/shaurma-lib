# ─────────────────────────────────────────────────────────────────────────────
# ShaurmaLib — єдині координати публікації
# ─────────────────────────────────────────────────────────────────────────────
#
# libVersion — ЄДИНЕ місце, де змінюється версія бібліотеки.
#
# Суфікс -SNAPSHOT тут принциповий: він робить модуль "changing module" для
# Gradle/Maven, тому КОНСЮМЕР (мод друга, snipers_shaurma, будь-хто) пише
# залежність БЕЗ конкретної версії релізу:
#
#     implementation 'dev.shaurmalib:shaurma-lib-forge:0.1.0-SNAPSHOT'
#
# і при кожній збірці автоматично отримує НАЙСВІЖІШИЙ опублікований
# SNAPSHOT. Тобто після `git push` у репозиторій бібліотеки, друга нічого
# не змінює у своєму build.gradle — він просто перезбирає мод.
libVersion=0.1.0-SNAPSHOT

# ── GitHub Packages координати ───────────────────────────────────────────────
# URL репозиторію GitHub Packages формується як
#   https://maven.pkg.github.com/<githubOwner>/<githubRepo>
githubOwner=B23101
githubRepo=shaurma-lib

# ── Credentials (СЮДИ НЕ ПИСАТИ!) ────────────────────────────────────────────
# Не зберігайте токен у цьому файлі — він потрапить у git.
# Варіанти:
#   1) CI (GitHub Actions) — GITHUB_ACTOR / GITHUB_TOKEN задаються автоматично;
#   2) локально — у ~/.gradle/gradle.properties (поза репозиторієм):
#          gpr.user=ТВІЙ_GITHUB_ЛОГІН
#          gpr.key=ТВІЙ_PERSONAL_ACCESS_TOKEN
#      Потрібен токен зі scopes: read:packages (+ write:packages для publish).
