plugins {
    id 'fabric-loom' version '1.17.19'
    id 'maven-publish'
}

def v = new Properties(); file('../../version.properties').withInputStream { v.load(it) }
group = 'dev.shaurmalib'
version = v.libVersion
base { archivesName = "shaurma-lib-anim-fabric-${mc_version}" }

def mv = file('../..')

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api}"
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-${mc_version}:${geckolib}"
}

// Джерела НЕ копіюються: беремо рівно пакет dev.shaurmalib.anim з трьох шарів mv.
sourceSets.main.java {
    srcDir new File(mv, 'core/src/main/java')
    srcDir new File(mv, "mc/${mc_layer}/src/main/java")
    srcDir new File(mv, 'loader/fabric/src/main/java')
    include 'dev/shaurmalib/anim/**', 'dev/shaurmalib/meta/**'
}
sourceSets.main.resources {
    srcDir new File(mv, 'core/src/main/resources')
    srcDir new File(mv, "mc/${mc_layer}/src/main/resources")
    srcDir new File(mv, 'loader/fabric/src/main/resources')
    include 'assets/shaurma_lib/shaurma_anim/**', 'assets/shaurma_lib/lang/**', 'shaurma_anim.mixins.json', 'fabric.mod.json'
}

loom {
    mixin { defaultRefmapName = 'shaurma_lib.refmap.json' }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java { toolchain.languageVersion = JavaLanguageVersion.of(java_version as int) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = java_version as int }

// Публікація: tools/publish.sh → гілка `maven` на GitHub
java { withSourcesJar() }
publishing {
    publications { create('mavenJava', MavenPublication) { artifactId = base.archivesName.get(); from components.java } }
    repositories { maven { name = 'ShaurmaRepo'; url = uri(file('../../build/maven-repo')) } }
}
