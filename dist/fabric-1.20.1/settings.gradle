// Перевірочний dist: ядро + шар 1.20.1 + клей Fabric → jar для Fabric 1.20.1.
// Доводить, що рушій анімацій не прибитий до Forge: ті самі джерела, інший лоадер.
pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'shaurma-lib-fabric-1.20.1'
